<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CATALA</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3efe5;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 650px;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.14)
                ),
                url("catala-hero.jpg");

            background-size: cover;
            background-position: center;

            overflow: hidden;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 30px 38px;

            z-index: 10;
        }


        .nav-brand {
            color: #f4efdf;

            text-decoration: none;

            font-size: 22px;
            font-weight: 900;

            letter-spacing: -1px;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 34px;
        }


        .nav-links a {
            position: relative;

            color: #f4efdf;

            text-decoration: none;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.5px;
        }


        .nav-links a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 0;
            height: 1px;

            background: #f4efdf;

            transition: width 0.25s ease;
        }


        .nav-links a:hover::after {
            width: 100%;
        }


        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {
            position: absolute;

            left: 50%;
            top: 56%;

            transform: translate(-50%, -50%);

            width: 100%;

            padding: 0 30px;

            text-align: center;
        }


        /* =========================
           MAIN CATALA LOGO
        ========================= */

        .hero-logo {
            display: block;

            width: min(780px, 72vw);
            height: auto;

            margin: 0 auto;

            /*
               Turns the black transparent PNG
               into warm cream.
            */

            filter:
                invert(96%)
                sepia(13%)
                saturate(447%)
                hue-rotate(339deg)
                brightness(105%)
                contrast(91%);
        }


        /* =========================
           SHOP BUTTON
        ========================= */

        .shop-button {
            display: inline-block;

            margin-top: 38px;

            padding: 14px 28px;

            border: 1px solid rgba(244, 239, 223, 0.9);

            color: #f4efdf;

            text-decoration: none;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 2.5px;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        .shop-button:hover {
            background: #f4efdf;

            color: #171717;
        }


        /* =========================
           SMALL PHOTO CREDIT
        ========================= */

        .photo-credit {
            position: absolute;

            right: 18px;
            bottom: 14px;

            color: rgba(244, 239, 223, 0.65);

            font-size: 8px;

            letter-spacing: 0.5px;

            text-decoration: none;

            z-index: 5;
        }


        .photo-credit:hover {
            color: #f4efdf;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .hero {
                min-height: 620px;

                background-position: center center;
            }


            .nav {
                padding: 22px 20px;
            }


            .nav-brand {
                font-size: 19px;
            }


            .nav-links {
                gap: 18px;
            }


            .nav-links a {
                font-size: 10px;
            }


            .nav-links a:nth-child(2) {
                display: none;
            }


            .hero-content {
                top: 55%;

                padding: 0 18px;
            }


            .hero-logo {
                width: 92vw;
            }


            .shop-button {
                margin-top: 30px;

                padding: 13px 23px;

                font-size: 10px;
            }


            .photo-credit {
                right: 10px;
                bottom: 8px;

                font-size: 7px;
            }

        }

    </style>

</head>


<body>


    <section class="hero">


        <!-- NAVIGATION -->

        <nav class="nav">

            <a class="nav-brand" href="#">
                CATALA
            </a>


            <div class="nav-links">

                <a href="#">
                    SHOP
                </a>

                <a href="#">
                    ABOUT
                </a>

                <a href="#">
                    CART (0)
                </a>

            </div>

        </nav>



        <!-- MAIN HERO -->

        <div class="hero-content">


            <img
                class="hero-logo"
                src="catala-logo.png"
                alt="CATALA">


            <a
                class="shop-button"
                href="#">

                SHOP THE DROP

            </a>


        </div>



        <!-- PHOTO CREDIT -->

        <a
            class="photo-credit"
            href="https://commons.wikimedia.org/wiki/File:Surfer_Cox_Bay_Tofino_2736.jpg"
            target="_blank"
            rel="noopener">

            PHOTO: IMAGEPERSON / CC BY 4.0

        </a>


    </section>


</body>

</html>
